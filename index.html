<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263b"><title>Tech Support Directory</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf3f9;background:#0c1724}*{box-sizing:border-box}body{margin:0}header{background:#13263b;border-bottom:1px solid #344b62;padding:20px max(18px,calc((100vw - 1080px)/2))}h1{font-size:1.5rem;margin:0}header p{margin:4px 0;color:#afc0d1}main{max-width:1080px;margin:auto;padding:22px 16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,button{font:inherit}input,select{background:#192d42;border:1px solid #3e536a;color:white;border-radius:10px;padding:12px}#search{flex:1;min-width:220px}button{cursor:pointer;border:1px solid #3c536a;background:#203950;color:#f4f7fa;border-radius:9px;padding:9px 12px}button:hover{background:#2c4d6b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #84b6ff;outline-offset:2px}.primary{background:#2566a4;border-color:#4b94cf}.meta{color:#b1c2d3;font-size:.89rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.contact{border:1px solid #34495d;background:#16283a;border-radius:14px;padding:16px}.top{display:flex;align-items:flex-start;gap:10px}.top .info{flex:1}h2{font-size:1.08rem;margin:0 0 4px}.tag{display:inline-block;margin-top:9px;padding:4px 8px;background:#2b4055;border-radius:6px;font-size:.8rem}.details{margin:12px 0;line-height:1.8;font-size:.93rem;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a{border:1px solid #47627e;background:#243f59;color:#e7f4ff;border-radius:8px;padding:8px 10px;text-decoration:none;font-size:.85rem}.actions a:hover{background:#305a7e}.fav{font-size:1.2rem;min-width:40px}.pick{margin-right:5px;accent-color:#8dbfff;width:18px;height:18px}.groupbar{position:sticky;bottom:0;background:#13263b;border:1px solid #49647f;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:20px;box-shadow:0 -4px 18px #0006}.hidden{display:none!important}.empty{color:#b9c7d5;padding:24px}small{color:#b8c7d7}footer{padding:25px;text-align:center;color:#9eb1c2;font-size:.8rem}
</style></head><body><header><h1>Tech Support Directory</h1><p>Tech Support · Staff & Family teams</p></header><main><div class="toolbar"><input id="search" type="search" aria-label="Search contacts" placeholder="Search name, title, phone, email…"><select id="team" aria-label="Filter team"><option value="All">All contacts</option><option>Leadership</option><option>Staff</option><option>Family</option><option value="Favorites">Favorites</option></select></div><p class="meta" id="count"></p><section class="grid" id="list"></section><div class="groupbar hidden" id="groupbar"><span id="selectedCount">0 selected</span><div><button id="clear">Clear</button> <button class="primary" id="group">Start Teams Group Chat</button></div></div></main><footer>Contact information stays in this installed app. Teams actions require an authorized Teams account.</footer><script>
'use strict';
const $=id=>document.getElementById(id);let contacts=[],selected=new Set(),favorites=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem('rp-directory-favorites')||'[]'))}catch{}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function link(label,url){const a=el('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function teamsChat(emails){return 'https://teams.microsoft.com/l/chat/0/0?users='+encodeURIComponent(emails.join(','))}
function teamsCall(email){return 'https://teams.microsoft.com/l/call/0/0?users='+encodeURIComponent(email)}
function render(){const q=$('search').value.trim().toLowerCase(),filter=$('team').value;const shown=contacts.filter(c=>(filter==='All'||(filter==='Favorites'?favorites.has(c.email):c.team===filter))&&[c.name,c.title,c.team,c.phone,c.extension,c.email].some(v=>v.toLowerCase().includes(q)));$('list').replaceChildren();$('count').textContent=shown.length+' of '+contacts.length+' contacts';for(const c of shown){const card=el('article','contact'),top=el('div','top'),check=el('input','pick');check.type='checkbox';check.checked=selected.has(c.email);check.setAttribute('aria-label','Select '+c.name+' for group chat');check.addEventListener('change',()=>{check.checked?selected.add(c.email):selected.delete(c.email);updateGroup()});const info=el('div','info');info.append(el('h2','',c.name),el('div','meta',c.title),el('span','tag',c.team));const star=el('button','fav',favorites.has(c.email)?'★':'☆');star.type='button';star.title='Toggle favorite';star.setAttribute('aria-label','Toggle favorite for '+c.name);star.addEventListener('click',()=>{favorites.has(c.email)?favorites.delete(c.email):favorites.add(c.email);localStorage.setItem('rp-directory-favorites',JSON.stringify([...favorites]));render()});top.append(check,info,star);const details=el('div','details');details.append(el('div','',c.phone+(c.extension?' · Ext. '+c.extension:'')),el('div','',c.email));const actions=el('div','actions');actions.append(link('Email','mailto:'+c.email),link('Teams Chat',teamsChat([c.email])),link('Teams Call',teamsCall(c.email)));card.append(top,details,actions);$('list').append(card)}if(!shown.length)$('list').append(el('p','empty','No matching contacts.'));updateGroup()}
function updateGroup(){$('groupbar').classList.toggle('hidden',selected.size<2);$('selectedCount').textContent=selected.size+' selected'}
$('search').addEventListener('input',render);$('team').addEventListener('change',render);$('clear').addEventListener('click',()=>{selected.clear();render()});$('group').addEventListener('click',()=>{if(selected.size>=2)window.open(teamsChat([...selected]),'_blank','noopener,noreferrer')});
fetch('./contacts.json').then(r=>{if(!r.ok)throw Error('Contact file unavailable');return r.json()}).then(data=>{contacts=data;render()}).catch(e=>{$('count').textContent='Could not load contacts: '+e.message});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
